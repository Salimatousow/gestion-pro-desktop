name: Construire l'installateur Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Gestion-pro-Setup
          path: dist/Gestion-pro-Setup.exe
      - name: Publier le setup pour le telechargement
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.1.${{ github.run_number }}" dist/Gestion-pro-Setup.exe \
            --title "Gestion pro - version ${{ github.run_number }}" \
            --notes "Installateur Windows de Gestion pro" --latest
